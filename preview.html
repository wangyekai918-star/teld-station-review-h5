<!doctype html>
<!-- 桌面交互预览容器：工具栏不会进入 APP，实际页面仍为 index.html。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>电站评价 · 交互预览</title>
  <style>
    /* 预览工具栏与外围画布样式，和 H5 正式页面样式独立。 */
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; background: #e9edf1; color: #414345; font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    .toolbar { width: 100%; max-width: 500px; margin: 0 auto 18px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    strong { color: #141517; font-size: 16px; }
    p { margin: 2px 0 0; font-size: 12px; color: #6f7173; }
    select, button { font: inherit; border: 1px solid #d4dce2; border-radius: 8px; padding: 5px 8px; background: #fff; color: #414345; }
    .controls { display: flex; gap: 6px; flex-shrink: 0; }
    /* 375 × 724px 对应设计稿去掉顶部原生导航后的可用内容区。 */
    iframe { display: block; width: 375px; max-width: 100%; height: 724px; margin: auto; border: 0; border-radius: 16px; box-shadow: 0 10px 40px #26354512; background: #f4f6f8; }
    .note { text-align: center; margin: 12px 0; }
    /* 手机查看预览时铺满屏幕，不额外模拟手机外框。 */
    @media (max-width: 500px) { body { padding: 12px 0 0; } .toolbar { padding: 0 12px; flex-wrap: wrap; } iframe { width: 100% !important; border-radius: 0; height: calc(100dvh - 120px); } }
  </style>
</head>
<body>
  <!-- 工具栏：切换预览宽度或重置表单，并明确说明提交不会上传。 -->
  <div class="toolbar">
    <div><strong>电站评价</strong><p>交互预览 · 提交仅演示，不会上传</p></div>
    <div class="controls">
      <select id="width" aria-label="预览宽度"><option>320</option><option selected>375</option><option>390</option><option>430</option></select>
      <button id="reset" type="button">重置</button>
    </div>
  </div>
  <!-- demo=1 开启演示提交；不代表业务接口已连接。 -->
  <iframe id="preview" src="./index.html?demo=1" title="电站评价H5"></iframe>
  <p class="note">顶部导航由 APP 提供 · 照片区可左右滑动</p>
  <script>
    // 通过同源 iframe 预览正式页面，不维护另一套页面或业务代码。
    const preview = document.getElementById('preview');
    // 在桌面模拟 34px 底部安全区域；APP 中由原生环境或 init 参数决定。
    preview.addEventListener('load', () => preview.contentWindow.StationReviewH5.init({ safeAreaBottom: 34 }));
    // 宽度切换只改变预览容器尺寸，表单内容保留。
    document.getElementById('width').addEventListener('change', (event) => { preview.style.width = event.target.value + 'px'; });
    // 调用页面公开接口清空评分、标签、文字和照片。
    document.getElementById('reset').addEventListener('click', () => { preview.contentWindow.StationReviewH5.reset(); });
  </script>
</body>
</html>
